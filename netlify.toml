# ==============================================================================
# SATENGKA PASUNG EWS — Netlify Deployment & Edge Routing Configuration
# Arsitektur: 100% Free Tier Hosting (Terhubung Otomatis ke Repository GitHub)
# ==============================================================================

[build]
  publish = "."
  # Jalankan script build pre-process untuk menjamin ketersediaan konfigurasi Firebase
  command = "node scripts/build-netlify.js"

# ------------------------------------------------------------------------------
# SECURITY & CACHING HEADERS UNTUK PWA & SERVICE WORKER
# ------------------------------------------------------------------------------

# Service Worker wajib no-cache agar pengguna selalu menerima pembaruan versi instan
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"

# Manifest PWA
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
    Content-Type = "application/manifest+json; charset=utf-8"

# Aset statis gambar dan ikon (Cache 1 tahun untuk kecepatan loading maksimal)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security Headers Global untuk Semua Halaman
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.gstatic.com https://cdn.tailwindcss.com https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://unpkg.com https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://unpkg.com https://firebasestorage.googleapis.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.gstatic.com wss://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; frame-src 'self' https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/firestore.rules"
  [headers.values]
    X-Robots-Tag = "noindex"

[[redirects]]
  from = "/firestore.rules"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/storage.rules"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/firebase.json"
  to = "/index.html"
  status = 404
  force = true

# ------------------------------------------------------------------------------
# REDIRECTS & CLEAN URLS UNTUK PWA STANDALONE
# ------------------------------------------------------------------------------

# Halaman default jika mengakses root
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# Fallback untuk URL tanpa ekstensi html
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/register"
  to = "/register.html"
  status = 200

[[redirects]]
  from = "/test.html"
  to = "/index.html"
  status = 404
  force = true

# Blokir injeksi Netlify Drawer HUD / Feedback Badge di pojokan
[[redirects]]
  from = "/.netlify/scripts/hud*"
  to = "/index.html"
  status = 404
  force = true
