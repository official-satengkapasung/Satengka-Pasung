name: SATENGKA PASUNG CI & Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-validate:
    name: Code Hygiene & Anti-Slop Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify JavaScript Syntax Integrity
        run: |
          node --check js/firebase-adapter.js
          node --check js/malekkas-engine.js
          node --check sw.js

      - name: Verify Inline Scripts & HTML Integrity
        run: |
          node -e "
            const fs = require('fs');
            const files = ['index.html', 'login.html', 'register.html'];
            files.forEach(f => {
              if (!fs.existsSync(f)) return;
              const content = fs.readFileSync(f, 'utf8');
              const scripts = content.match(/<script[\s\S]*?<\/script>/gi) || [];
              scripts.forEach((s, idx) => {
                if (s.includes('type=\"module\"')) return;
                const code = s.replace(/<script[\s\S]*?>/i, '').replace(/<\/script>/i, '');
                if (!code.trim()) return;
                try {
                  new Function(code);
                } catch (err) {
                  console.error('Syntax error in ' + f + ' (script ' + idx + '):', err.message);
                  process.exit(1);
                }
              });
              console.log('✅ Syntax valid for all scripts in:', f);
            });
          "

      - name: Run DevSecOps & Anti-Slop Audit
        run: |
          node scripts/anti-slop-audit.js

      - name: Audit Manifest & PWA Assets
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('./manifest.json', 'utf8'));
            if (!manifest.name || !manifest.icons || manifest.icons.length === 0) {
              console.error('PWA Manifest invalid!');
              process.exit(1);
            }
            console.log('✅ PWA Manifest valid:', manifest.name);
          "

      - name: Test Netlify Build Pre-Process
        run: |
          node scripts/build-netlify.js
